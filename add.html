<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grovia - List Your Farm Stand</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f9f6f0; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 600px; 
            margin: 40px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border-top: 6px solid #2c5e3b;
        }
        h2 { color: #2c5e3b; margin-top: 0; }
        p { color: #555; line-height: 1.5; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #2c5e3b; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 25px; width: 100%; }
        button:hover { background: #1a3c26; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>List Your Farm Stand on Grovia</h2>
        <p>Get discovered by local buyers in Southern Ontario. Annual directory listing fee: <strong>$25.00</strong>.</p>
        
        <form id="farm-form">
            <label>Farm Stand Name</label>
            <input type="text" id="title" placeholder="e.g., Green Valley Family Farm" required>

            <label>Full Address (Street, Town, Postal Code)</label>
            <input type="text" id="address" placeholder="e.g., 6098 Line 4, New Tecumseth, ON L9R 1V4" required>

            <label>Products Sold (comma separated)</label>
            <textarea id="products" placeholder="e.g., Fresh Eggs, Honey, Sourdough Bread" rows="3" required></textarea>

            <button type="submit" id="submit-btn">Proceed to Secure Checkout ($25)</button>
        </form>

        <div id="status"></div>
    </div>

    <!-- Supabase Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://xlftvjrhzklunsbaxcur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_uaolZH8xAaLSPE91nHaIbA_pFKxUEHt';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // REPLACE WITH YOUR ACTUAL STRIPE PAYMENT LINK
        const STRIPE_PAYMENT_LINK = 'https://buy.stripe.com/test_cNi5kCa6b14Z0ip38M2B201';

        document.getElementById('farm-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const statusDiv = document.getElementById('status');
            const submitBtn = document.getElementById('submit-btn');

            const title = document.getElementById('title').value;
            const address = document.getElementById('address').value;
            const products = document.getElementById('products').value;

            statusDiv.style.color = '#333';
            statusDiv.innerHTML = "📍 Translating address to GPS coordinates...";
            submitBtn.disabled = true;

            const encodedAddress = encodeURIComponent(address + ", Canada");

            try {
                // 1. Geocode address via OpenStreetMap Nominatim
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodedAddress}`);
                const results = await response.json();

                if (!results || results.length === 0) {
                    throw new Error("Could not find GPS coordinates for this address. Please check your spelling.");
                }

                const latitude = parseFloat(results[0].lat);
                const longitude = parseFloat(results[0].lon);

                statusDiv.innerHTML = `✅ Coordinates found. Saving to database & redirecting to Stripe...`;

                // 2. Insert into Supabase as Inactive (Active = false) awaiting payment
                const { data, error } = await supabase.from('farms').insert([
                    {
                        title: title,
                        Address: address,
                        Products: products,
                        Latitude: latitude,
                        Longitude: longitude,
                        Active: false
                    }
                ]).select();

                if (error) throw error;

                // Save reference so we can activate it when returning from Stripe
                if (data && data.length > 0) {
                    localStorage.setItem('pending_farm_id', data[0].id);
                }

                // 3. Redirect to Stripe Checkout Paywall
                window.location.href = STRIPE_PAYMENT_LINK;

            } catch (err) {
                console.error(err);
                statusDiv.style.color = 'red';
                statusDiv.innerHTML = "❌ Error: " + err.message;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
