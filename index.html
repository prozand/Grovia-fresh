<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grovia - Admin Advertiser Portal</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f6f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #388e3c;
            color: white;
            padding: 15px 25px;
            width: 100%;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 { margin: 0; font-size: 22px; }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            margin: 40px 20px;
            box-sizing: border-box;
            border-top: 4px solid #e65100;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="text"], input[type="url"], input[type="email"], input[type="tel"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #388e3c;
            box-shadow: 0 0 5px rgba(56, 142, 60, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #388e3c;
        }

        .btn {
            background-color: #e65100;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        .btn:hover { background-color: #bf360c; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1976d2;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }

        #status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

    <header>
        <h1>🌱 Grovia Admin — Add Advertiser</h1>
    </header>

    <div class="container">
        <form id="ad-form">
            <div class="form-group">
                <label for="business_name">Advertiser / Business Name *</label>
                <input type="text" id="business_name" required placeholder="e.g. Simcoe Farm Supply">
            </div>

            <div class="form-group">
                <label for="tagline">Tagline / Short Offer</label>
                <input type="text" id="tagline" placeholder="e.g. Feed, seed & fencing in Alliston">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 705-555-0199">
            </div>

            <div class="form-group">
                <label for="target_url">Target Website URL</label>
                <input type="url" id="target_url" placeholder="https://example.com">
            </div>

            <div class="form-group">
                <label for="logo_file">Upload Graphic / Logo</label>
                <input type="file" id="logo_file" accept="image/*">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="active" checked>
                <label for="active" style="margin-bottom: 0;">Publish Live Immediately</label>
            </div>

            <button type="submit" class="btn" id="submit-btn">Save Advertiser to Supabase</button>
            
            <div id="status-message"></div>
        </form>

        <a href="index.html" class="back-link">← Back to Grovia Map</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xlftvjrhzklunsbaxcur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_uaolZH8xAaLSPE91nHaIbA_pFKxUEHt';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('ad-form');
        const statusMsg = document.getElementById('status-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading & Saving...';
            statusMsg.style.display = 'none';

            try {
                let imageUrl = null;
                const fileInput = document.getElementById('logo_file');

                // Handle file upload to Supabase Storage if a file was selected
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
                    const filePath = `${fileName}`;

                    let { error: uploadError } = await dbClient.storage
                        .from('advertiser-logos')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    // Get public URL of the uploaded image
                    const { data: publicUrlData } = dbClient.storage
                        .from('advertiser-logos')
                        .getPublicUrl(filePath);

                    imageUrl = publicUrlData.publicUrl;
                }

                // Prepare advertiser payload
                const newAd = {
                    business_name: document.getElementById('business_name').value.trim(),
                    tagline: document.getElementById('tagline').value.trim() || null,
                    phone: document.getElementById('phone').value.trim() || null,
                    target_url: document.getElementById('target_url').value.trim() || null,
                    image_url: imageUrl,
                    active: document.getElementById('active').checked
                };

                // Insert into advertisers table
                const { error: insertError } = await dbClient
                    .from('advertisers')
                    .insert([newAd]);

                if (insertError) throw insertError;

                statusMsg.textContent = 'Advertiser successfully uploaded and published live!';
                statusMsg.className = 'success';
                statusMsg.style.display = 'block';
                form.reset();
                document.getElementById('active').checked = true;

            } catch (err) {
                console.error("Submission error:", err);
                statusMsg.textContent = 'Error: ' + err.message;
                statusMsg.className = 'error';
                statusMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Advertiser to Supabase';
            }
        });
    </script>
</body>
</html>
