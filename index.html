<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grovia - Southern Ontario Farm Directory</title>
    <!-- Favicon Fix -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f6f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c5e3b;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #e65100;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #bf360c;
        }
        .btn-secondary {
            background-color: #1976d2;
        }
        .btn-secondary:hover {
            background-color: #115293;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .leaflet-popup-content h3 {
            color: #2c5e3b;
            margin: 0 0 5px 0;
        }
        .leaflet-popup-content p {
            margin: 4px 0;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌱 Grovia Farm Directory</h1>
        <div class="header-controls">
            <button class="btn btn-secondary" id="locate-btn" title="Center map on your location">📍 My Location</button>
            <a href="add.html" class="btn">+ List Your Stand ($25)</a>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Initialize Map centered on Southern Ontario as fallback
        const map = L.map('map').setView([44.05, -79.85], 10);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Supabase Credentials
        const SUPABASE_URL = 'https://xlftvjrhzklunsbaxcur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_uaolZH8xAaLSPE91nHaIbA_pFKxUEHt';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Escape helper for safe text rendering in popups
        function safeText(str) {
            return String(str || '').replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Load active farm markers from Supabase
        async function loadActiveFarms() {
            try {
                const { data: farms, error } = await dbClient
                    .from('farms')
                    .select('*')
                    .eq('Active', true);

                if (error) throw error;

                if (farms) {
                    farms.forEach(farm => {
                        if (farm.Latitude && farm.Longitude) {
                            const popupContent = `
                                <div>
                                    <h3>${safeText(farm.title)}</h3>
                                    <p><strong>Address:</strong> ${safeText(farm.Address)}</p>
                                    <p><strong>Products:</strong> ${safeText(farm.Products)}</p>
                                </div>
                            `;
                            L.marker([farm.Latitude, farm.Longitude])
                             .addTo(map)
                             .bindPopup(popupContent);
                        }
                    });
                }
            } catch (err) {
                console.error("Error loading active farms:", err);
            }
        }

        // Request user geolocation on load and zoom to ~25km radius (Zoom level 11)
        function initUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        
                        // Set map view to user location at zoom level 11 (~25km radius scope)
                        map.setView([userLat, userLng], 11);

                        // Add a subtle blue marker for the user's location
                        L.circleMarker([userLat, userLng], {
                            radius: 8,
                            fillColor: '#1976d2',
                            color: '#fff',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup("<b>You are here</b>");
                    },
                    (error) => {
                        console.warn("Geolocation permission denied or unavailable:", error.message);
                        // Keeps default Southern Ontario center if user blocks or denies location
                    },
                    { timeout: 10000, maximumAge: 60000 }
                );
            }
        }

        // Hook up the manual "My Location" button in the header
        document.getElementById('locate-btn').addEventListener('click', () => {
            initUserLocation();
        });

        // Run startup routines
        loadActiveFarms();
        initUserLocation();
    </script>
</body>
</html>
